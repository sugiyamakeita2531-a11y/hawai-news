name: Daily Hawaii News Updater

on:
  schedule:
    # 毎日日本時間の朝6時（UTC 21:00）に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ニュース収集スクリプトを実行
        run: python fetch_news.py

      - name: 更新されたニュースデータを保存・公開
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Auto-update Hawaii news [skip ci]" || echo "No changes to commit"
          git push
